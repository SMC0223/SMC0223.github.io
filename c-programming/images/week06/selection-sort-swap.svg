<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="title"><title id="title">임시 변수 temp를 사용한 두 원소의 값 교환</title><rect width="1600" height="660" fill="white"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif">
<text x="45" y="48" font-size="32" fill="#233b53" font-weight="700" text-anchor="start">실행한 문장</text>
<text x="770" y="48" font-size="32" fill="#233b53" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">a[0]</text>
<text x="1060" y="48" font-size="32" fill="#233b53" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">a[3]</text>
<text x="1350" y="48" font-size="32" fill="#233b53" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">temp</text>
<text x="45" y="142" font-size="32" fill="#233b53" font-weight="700" text-anchor="start">교환 전</text>
<rect x="660" y="85" width="220" height="90" rx="7" fill="#9765b2" stroke="none" stroke-width="4"/>
<text x="770" y="146" font-size="43" fill="white" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">5</text>
<rect x="950" y="85" width="220" height="90" rx="7" fill="#25836d" stroke="none" stroke-width="4"/>
<text x="1060" y="146" font-size="43" fill="white" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">1</text>
<rect x="1240" y="85" width="220" height="90" rx="7" fill="#edf2f7" stroke="none" stroke-width="4"/>
<text x="1350" y="146" font-size="43" fill="#64748b" font-weight="700" text-anchor="middle">—</text>
<text x="45" y="280" font-size="32" fill="#233b53" font-weight="700" text-anchor="start" font-family="Consolas, monospace">int temp = a[0];</text>
<rect x="660" y="223" width="220" height="90" rx="7" fill="#9765b2" stroke="none" stroke-width="4"/>
<text x="770" y="284" font-size="43" fill="white" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">5</text>
<rect x="950" y="223" width="220" height="90" rx="7" fill="#25836d" stroke="none" stroke-width="4"/>
<text x="1060" y="284" font-size="43" fill="white" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">1</text>
<rect x="1240" y="223" width="220" height="90" rx="7" fill="#9765b2" stroke="#233b53" stroke-width="4"/>
<text x="1350" y="284" font-size="43" fill="white" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">5</text>
<text x="45" y="418" font-size="32" fill="#233b53" font-weight="700" text-anchor="start" font-family="Consolas, monospace">a[0] = a[3];</text>
<rect x="660" y="361" width="220" height="90" rx="7" fill="#25836d" stroke="#233b53" stroke-width="4"/>
<text x="770" y="422" font-size="43" fill="white" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">1</text>
<rect x="950" y="361" width="220" height="90" rx="7" fill="#25836d" stroke="none" stroke-width="4"/>
<text x="1060" y="422" font-size="43" fill="white" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">1</text>
<rect x="1240" y="361" width="220" height="90" rx="7" fill="#9765b2" stroke="none" stroke-width="4"/>
<text x="1350" y="422" font-size="43" fill="white" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">5</text>
<text x="45" y="556" font-size="32" fill="#233b53" font-weight="700" text-anchor="start" font-family="Consolas, monospace">a[3] = temp;</text>
<rect x="660" y="499" width="220" height="90" rx="7" fill="#25836d" stroke="none" stroke-width="4"/>
<text x="770" y="560" font-size="43" fill="white" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">1</text>
<rect x="950" y="499" width="220" height="90" rx="7" fill="#9765b2" stroke="#233b53" stroke-width="4"/>
<text x="1060" y="560" font-size="43" fill="white" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">5</text>
<rect x="1240" y="499" width="220" height="90" rx="7" fill="#9765b2" stroke="none" stroke-width="4"/>
<text x="1350" y="560" font-size="43" fill="white" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">5</text>
<text x="800" y="650" font-size="30" fill="#233b53" font-weight="700" text-anchor="middle">temp에 원래 값을 보관한 뒤 두 칸의 값 교환</text>
</g></svg>