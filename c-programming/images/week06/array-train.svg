<title id="title">배열을 기차로 이해하기: scores의 네 칸</title>
<desc id="desc">기차 편명 scores는 배열 이름. 같은 int형 값을 담는 객차 네 칸의 번호는 0, 1, 2, 3. 저장된 값은 각각 80, 95, 70, 85. 각 칸은 scores[0]부터 scores[3]으로 선택. 배열 이름 scores로 첫 칸의 메모리 주소 확인 가능.</desc>
