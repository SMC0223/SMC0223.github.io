<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="title desc">
<title id="title">자료형에 따른 배열 객차 크기 비교</title>
<desc id="desc">객차 한 칸은 원소 하나. char 배열은 원소당 1바이트, int와 float 배열은 원소당 4바이트, double 배열은 원소당 8바이트인 일반적인 환경의 예시. 객차의 가로 폭은 1 대 4 대 8 비율. 각 배열 안에서는 네 객차의 크기가 모두 같음.</desc>
