<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="355" viewBox="0 0 1600 355" role="img" aria-labelledby="title desc">
<title id="title">공 넣기: 바구니와 배열 연결</title><desc id="desc">1번부터 5번 바구니를 basket[0]부터 basket[4]에 대응. 처음에는 빈 바구니이므로 모든 값은 0.</desc>
