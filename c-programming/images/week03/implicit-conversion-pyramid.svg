<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">char부터 위로 넓어지는 자동 형 변환 단계와 일반 크기</title>
<desc id="desc">아래부터 char, short, int, long, long long, float, double, long double. 오른쪽에 일반적인 바이트 수 표시. 일반적인 환경의 부호 있는 정수와 실수 간 산술 연산을 단순화한 그림이며 층의 너비는 바이트 수에 비례하지 않음.</desc>
<defs><marker id="up" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#236594"/></marker></defs>
<rect width="1400" height="660" rx="24" fill="#f6f9fc"/>
<g font-family="Malgun Gothic, sans-serif">
<text x="585" y="37" text-anchor="middle" font-size="26" fill="#123d66" font-weight="700">산술 연산의 공통 자료형</text>
<text x="1115" y="37" font-size="26" fill="#123d66" font-weight="700">일반 크기</text>
<path d="M85 520V110" stroke="#236594" stroke-width="7" marker-end="url(#up)"/>

<path d="M135.0 55H1035.0L1000.0 112H170.0Z" fill="#123d66"/>
<text x="585" y="94" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">long double</text>
