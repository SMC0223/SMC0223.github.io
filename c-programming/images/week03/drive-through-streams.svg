<use href="#cup" transform="translate(1004 332) scale(.75)"/>
<rect x="820" y="383" width="273" height="16" rx="3" fill="#9c7653"/>
<g text-anchor="middle" fill="#174f3c"><text x="956" y="471" font-size="30" font-weight="700">프로그램</text><text x="956" y="512" font-size="25">주문 확인 → 제조</text></g>
<!-- Output -->
<path d="M1121 332H1245" fill="none" stroke="#00754a" stroke-width="4" marker-end="url(#arrow)"/>
<text x="1182" y="301" font-size="25" text-anchor="middle" fill="#00754a">stdout</text>
<rect x="1255" y="119" width="325" height="427" rx="22" fill="#f1f7f3"/>
<rect x="1280" y="188" width="275" height="197" rx="8" fill="#e5ded0"/>
<rect x="1280" y="188" width="275" height="47" rx="7" fill="#00754a"/>
<text x="1417" y="220" text-anchor="middle" font-size="26" fill="#fff">음료 수령 창구</text>
<rect x="1301" y="250" width="233" height="111" fill="#fff"/>
<use href="#cup" x="1334" y="284"/><use href="#cup" x="1434" y="284"/>
<rect x="1290" y="349" width="255" height="14" rx="3" fill="#9c7653"/>
<g text-anchor="middle" fill="#174f3c"><text x="1417" y="471" font-size="30" font-weight="700">표준 출력</text><text x="1417" y="512" font-size="25">완성된 결과 전달</text></g>
<!-- Diagnostic output -->
<path d="M956 549V602H1056" stroke="#a56925" stroke-width="4" stroke-dasharray="7 5" fill="none" marker-end="url(#amber)"/>
<rect x="1070" y="566" width="510" height="81" rx="15" fill="#fff3e3" stroke="#e3c297"/>
<text x="1094" y="599" font-size="25" font-weight="700" fill="#89551e">stderr · 오류·진단 안내</text>
<text x="1094" y="632" font-size="24" fill="#89551e">예: “재료 소진”</text>
<text x="30" y="596" font-size="27" font-weight="700" fill="#174f3c">입력 출처가 달라도 같은 처리 과정 사용</text>
<text x="30" y="638" font-size="25" fill="#526c60">키보드 / 파일 → stdin → 프로그램 → stdout</text>
</g></svg>