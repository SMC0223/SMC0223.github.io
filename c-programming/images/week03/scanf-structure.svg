<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 610" role="img" aria-labelledby="title desc">
<title id="title">scanf 형식 지정자와 변수 주소의 대응</title>
<desc id="desc">scanf의 %d와 &amp;joint는 빨강, %lf와 &amp;angle은 파랑으로 연결. 입력 1 30.5를 읽으면 int joint에 1, double angle에 30.5 저장. 앰퍼샌드는 입력값을 저장할 변수의 주소를 뜻함.</desc>
<defs>
<marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#db3131"/></marker>
<marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#285dd5"/></marker>
</defs>
<rect width="1500" height="610" fill="#fff"/>
<g font-family="Malgun Gothic, sans-serif">
<rect x="45" y="20" width="1410" height="74" rx="14" fill="#f4f7fb"/>
<text x="75" y="67" font-size="29" fill="#35566f">입력 예</text>
<text x="245" y="68" font-size="36" font-family="Consolas, monospace"><tspan fill="#db3131">1</tspan><tspan fill="#285dd5"> 30.5</tspan></text>
<text x="620" y="67" font-size="28" fill="#35566f">공백으로 구분한 정수 1개와 실수 1개</text>
<g fill="none" stroke="#ced9e3" stroke-width="2">
<rect x="75" y="221" width="170" height="83" rx="10"/>
<rect x="288" y="221" width="240" height="83" rx="10"/>
<rect x="622" y="221" width="216" height="83" rx="10"/>
<rect x="930" y="221" width="228" height="83" rx="10"/>
</g>
<g font-family="Consolas, monospace" font-size="44" fill="#1b344b">
<text x="95" y="277">scanf</text><text x="253" y="277">(</text>
<text x="300" y="277">&quot;<tspan fill="#db3131" font-weight="700">%d</tspan> <tspan fill="#285dd5" font-weight="700">%lf</tspan>&quot;</text>
<text x="550" y="277">,</text>
<text x="650" y="277" fill="#db3131" font-weight="700">&amp;joint</text>
<text x="864" y="277">,</text>
<text x="951" y="277" fill="#285dd5" font-weight="700">&amp;angle</text>
<text x="1180" y="277">);</text>
</g>
<path d="M353 217V163H730V216" fill="none" stroke="#db3131" stroke-width="4" marker-end="url(#red)"/>
<text x="540" y="143" text-anchor="middle" fill="#db3131" font-size="26">%d ↔ int 변수의 주소</text>
<path d="M444 309V357H1040V310" fill="none" stroke="#285dd5" stroke-width="4" marker-end="url(#blue)"/>
<text x="741" y="393" text-anchor="middle" fill="#285dd5" font-size="26">%lf ↔ double 변수의 주소</text>
<text x="160" y="343" text-anchor="middle" fill="#526b80" font-size="24">함수 이름</text>
<text x="1310" y="251" text-anchor="middle" fill="#35566f" font-size="25">&amp; : 값을 저장할</text>
<text x="1310" y="287" text-anchor="middle" fill="#35566f" font-size="25">변수의 주소</text>
<rect x="215" y="426" width="465" height="132" rx="15" fill="#fff2f2" stroke="#e3a1a1" stroke-width="2"/>
<rect x="790" y="426" width="465" height="132" rx="15" fill="#eef3ff" stroke="#9cb7ee" stroke-width="2"/>
<g text-anchor="middle">
<text x="448" y="467" fill="#a42626" font-size="27">int joint</text>
<text x="448" y="526" fill="#db3131" font-size="39" font-weight="700">1 저장</text>
<text x="1022" y="467" fill="#2851a7" font-size="27">double angle</text>
<text x="1022" y="526" fill="#285dd5" font-size="39" font-weight="700">30.5 저장</text>
<text x="750" y="599" fill="#35566f" font-size="26">형식 지정자 순서대로 입력을 읽어 각 변수에 저장함.</text>
</g>
</g>
</svg>
