<text x="300" y="143">방문 횟수 = 0</text>
<text x="300" y="234">현재 좌표 출력</text>
<text x="300" y="347">마지막 칸 방문?</text>
<text x="645" y="347" fill="#b95c51">중심 도착 · 종료</text>
<text x="300" y="491">현재 방향의 경계?</text>
<text x="620" y="540" font-size="25">경계 축소</text>
<text x="620" y="566" font-size="25">시계 방향 전환</text>
<text x="300" y="637">한 칸 이동</text>
<text x="300" y="728">방문 횟수 증가</text>
<text x="495" y="324" font-size="23" fill="#b95c51">참</text>
<text x="335" y="414" font-size="23">거짓</text>
<text x="514" y="469" font-size="23">참</text>
