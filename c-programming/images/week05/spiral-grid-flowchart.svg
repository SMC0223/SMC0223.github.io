<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" role="img" aria-labelledby="title desc">
<title id="title">달팽이 이동 구현 순서도</title>
<desc id="desc">위치와 방향, 경계, 방문 횟수를 초기화한 뒤 현재 좌표 출력. 마지막 칸이면 중심 도착 후 종료. 나머지는 경계 도달 여부에 따라 경계 축소와 방향 전환 후 한 칸 이동. 방문 횟수를 증가하고 좌표 출력으로 복귀.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 9 4 0 8Z" fill="#34475c"/></marker>
<marker id="accent" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 9 4 0 8Z" fill="#b95c51"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#a9b2bb"/></filter>
</defs>
