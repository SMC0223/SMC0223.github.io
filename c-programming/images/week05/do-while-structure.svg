<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
<title id="title">do–while의 반복 실행문과 반복 조건</title>
<desc id="desc">중괄호 안의 반복 실행문을 먼저 수행하고 뒤의 반복 조건을 검사. 참이면 반복 실행문으로 돌아가고 거짓이면 종료. 마지막 세미콜론 필수.</desc>
<rect x="2" y="2" width="1396" height="466" rx="24" fill="#f7f9fc" stroke="#dce4ed" stroke-width="2"/>
<g font-family="Malgun Gothic, Noto Sans KR, sans-serif">
<text x="48" y="48" font-size="25" font-weight="700" fill="#52667c">문법 구조</text>
<text x="825" y="48" font-size="25" font-weight="700" fill="#52667c">각 부분의 역할</text>
<text x="56" y="101" font-size="36" font-weight="700" fill="#175fa2">do {</text>
<rect x="110" y="120" width="563" height="113" rx="12" fill="#e0f2ed"/>
<text x="142" y="165" font-size="36" font-weight="700" fill="#17705b">반복 실행문</text>
<text x="142" y="209" font-size="26" fill="#17705b">출력, 계산, 값 변경 등을 포함</text>
<path d="M673 155H767" stroke="#17705b" stroke-width="2.5"/>
<circle cx="790" cy="155" r="18" fill="#17705b"/>
<text x="790" y="163" text-anchor="middle" font-size="22" font-weight="700" fill="white">1</text>
<text x="825" y="130" font-size="30" font-weight="700" fill="#17705b">반복 실행문</text>
<text x="825" y="174" font-size="26" fill="#52667c">조건 검사 전에 먼저 실행</text>
<text x="825" y="211" font-size="26" fill="#52667c">처음에는 반드시 한 번 수행</text>
<rect x="245" y="273" width="245" height="65" rx="10" fill="#e5eafa"/>
<text x="56" y="318" font-size="36" font-weight="700" fill="#1c3651">} <tspan fill="#175fa2">while (</tspan></text>
<text x="267" y="318" font-size="36" font-weight="700" fill="#535ba0">반복 조건</text>
<text x="505" y="318" font-size="36" font-weight="700" fill="#1c3651">)</text>
<text x="535" y="318" font-size="40" font-weight="700" fill="#b14d18">;</text>
<text x="512" y="367" font-size="24" font-weight="700" fill="#b14d18">세미콜론 필수</text>
<path d="M490 282H767" stroke="#535ba0" stroke-width="2.5"/>
<circle cx="790" cy="282" r="18" fill="#535ba0"/>
<text x="790" y="290" text-anchor="middle" font-size="22" font-weight="700" fill="white">2</text>
<text x="825" y="285" font-size="30" font-weight="700" fill="#535ba0">반복 조건</text>
<text x="825" y="329" font-size="26" fill="#52667c">참이면 반복 실행문으로 복귀</text>
<text x="825" y="366" font-size="26" fill="#52667c">거짓이면 반복 종료</text>
<path d="M38 394H1362" stroke="#dce4ed" stroke-width="2"/>
<text x="700" y="439" text-anchor="middle" font-size="29" font-weight="700" fill="#1c3651">반복 실행문 수행 → 반복 조건 검사 → 참이면 다시 수행</text>
</g></svg>
