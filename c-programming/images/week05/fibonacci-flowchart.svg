<svg xmlns="http://www.w3.org/2000/svg" width="780" height="620" viewBox="0 0 780 620" role="img" aria-labelledby="title desc">
<title id="title">A=1, B=0에서 시작하는 피보나치 순서도</title>
<desc id="desc">시작 후 A=1, B=0으로 초기화. A가 6보다 작으면 A를 출력하고 A=A+B, B=A-B를 순서대로 수행한 뒤 조건 검사로 복귀. 출력은 1, 1, 2, 3, 5.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8Z" fill="#283544"/></marker><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#999"/></filter></defs>
<g fill="none" stroke="#283544" stroke-width="2.5" marker-end="url(#arrow)">
<path d="M300 60V97"/><path d="M300 157V203"/><path d="M300 297V342"/><path d="M300 409V457"/>
<path d="M300 550V594H55V180H300V203"/><path d="M465 250H576V320"/>
</g>
<g fill="white" stroke="#283544" stroke-width="2.3" filter="url(#shadow)">
<rect x="170" y="10" width="260" height="50" rx="25"/>
<path d="M180 97H420L450 127 420 157H180L150 127Z"/>
<path d="M300 203 465 250 300 297 135 250Z"/>
<path d="M160 342H440V407Q370 398 300 411Q230 424 160 411Z"/>
<rect x="160" y="457" width="280" height="93"/>
<rect x="491" y="320" width="170" height="55" rx="27"/>
</g>
<g font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="28" fill="#233b53" text-anchor="middle">
<text x="300" y="45">시작</text><text x="300" y="137">A = 1, B = 0</text>
<text x="300" y="260">A &lt; 6</text><text x="328" y="328" font-size="24">예</text><text x="528" y="237" font-size="24">아니오</text>
<text x="300" y="384">A값을 출력</text><text x="300" y="493">A = A + B</text><text x="300" y="530">B = A - B</text>
<text x="576" y="356">종료</text>
</g></svg>
