<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">토끼 쌍이 가지처럼 늘어나는 피보나치 수열</title>
<desc id="desc">위에서 아래로 한 달씩 진행하며 한 쌍, 한 쌍, 두 쌍, 세 쌍, 다섯 쌍으로 증가. 각 쌍은 파란 수컷과 분홍 암컷으로 구성. 작은 토끼는 새끼, 큰 토끼는 어른. 실선은 기존 쌍의 성장과 유지, 점선은 새끼 쌍의 탄생.</desc>
<defs><g id="rabbit" stroke="#34475c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
