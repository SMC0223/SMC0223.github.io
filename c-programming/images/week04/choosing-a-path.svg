<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
  <title id="title">갈림길에서 하나의 길을 선택해 나아가는 휴머노이드 로봇</title>
  <desc id="desc">왼쪽에서 시작한 길이 세 갈래로 나뉨. 관절과 금속 외장을 갖춘 휴머노이드 로봇이 파란색으로 강조된 위쪽 길을 선택해 오른쪽으로 걸어감.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#1768ac"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="1096" height="336" rx="28" fill="#f5f8fc"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
