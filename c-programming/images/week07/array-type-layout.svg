<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
<title id="title">왼쪽 세로 메모리와 오른쪽 배열 확대도</title><desc id="desc">왼쪽은 첨부 참고 그림의 세로 메모리 표와 묶음 괄호를 적용한 배열 그림. 오른쪽은 배열 확대도. char letters[5]는 위쪽, int scores[5]는 아래쪽에 떨어져 배치. 오른쪽 괄호는 각 배열의 전체 공간을 묶음. char 원소는 1바이트, int 원소는 4바이트이며 같은 바이트 축척 유지. 각 배열의 첫 원소는 전체 주소, 다른 원소는 주소 끝부분 표시.</desc>
