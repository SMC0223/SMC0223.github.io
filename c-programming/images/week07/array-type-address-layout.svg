<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
<title id="title">주소값·메모리 원소·배열 괄호를 나란히 배치한 세로 메모리 맵</title><desc id="desc">왼쪽은 세로 메모리와 주소, 오른쪽은 배열 확대도. 각 배열의 첫 원소는 MSVC x64 실행의 전체 주소 표시. 다른 원소는 끝 네 자리 표시. 높은 주소가 위쪽이며 char 배열은 fb54부터 fb50, int 배열은 fb48부터 fb38 순서로 표시. 주소값을 각 원소 옆에 대응하고 오른쪽 괄호로 배열 전체를 묶음. 두 배열 사이 구간은 생략. 원소별 주소는 시작 주소를 의미하며, 실행마다 배열의 위치·순서·간격 변경 가능.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#164b7a"/></marker></defs>
