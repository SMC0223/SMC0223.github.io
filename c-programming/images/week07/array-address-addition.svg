81V120" stroke="#164b7a" stroke-width="1.5" stroke-dasharray="5 5"/><text x="760" y="77" text-anchor="start" font-size="32" font-weight="700" fill="#164b7a">1바이트</text><path d="M300 193V220H280" fill="none" stroke="#164b7a" stroke-width="2"/><path d="M350 193V220H370" fill="none" stroke="#164b7a" stroke-width="2"/><text x="280" y="246" text-anchor="end" font-size="29" font-weight="700" fill="#164b7a">letters</text><text x="370" y="246" text-anchor="start" font-size="29" font-weight="700" fill="#164b7a">letters + 1</text><text x="280" y="278" text-anchor="end" font-size="24" font-weight="400" fill="#164b7a">0x1b1d3bfb50</text><text x="370" y="278" text-anchor="start" font-size="24" font-weight="400" fill="#164b7a">…fb51</text><text x="40" y="451" text-anchor="start" font-size="30" font-weight="700" fill="#23796f">int scores[5]</text><text x="265" y="395" text-anchor="end" font-size="24" font-weight="700" fill="#233b53">index</text><text x="400.0" y="395" text-anchor="middle" font-size="26" font-weight="400" fill="#23796f">0</text><rect x="300" y="410" width="200" height="65" rx="4" fill="#e1f1ed" stroke="#23796f" stroke-width="2"/><path d="M350 412V473" stroke="#9bafc0" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M400 412V473" stroke="#9bafc0" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M450 412V473" stroke="#9bafc0" stroke-width="1.5" stroke-dasharray="5 5"/><text x="600.0" y="395" text-anchor="middle" font-size="26" font-weight="400" fill="#23796f">1</text><rect x="500" y="410" width="200" height="65" rx="4" fill="#c9e7dd" stroke="#23796f" stroke-width="2"/><path d="M550 412V473" stroke="#9bafc0" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M600 412V473" stroke="#9bafc0" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M650 412V473" stroke="#9bafc0" stroke-width="1.5" stroke-dasharray="5 5"/><text x="800.0" y="395" text-anchor="middle" font-size="26" font-weight="400" fill="#23796f">2</text><rect x="700" y="410" width="200" height="65" rx=