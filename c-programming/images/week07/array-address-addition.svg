<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">char와 int 배열에서 +1이 이동하는 주소 간격 비교</title><desc id="desc">letters와 scores 배열을 같은 바이트 축척으로 표시. 화살표는 첫 원소의 시작 주소에서 두 번째 원소의 시작 주소까지 이동. letters + 1은 1바이트 이동하고 scores + 1은 int가 4바이트인 환경에서 4바이트 이동. 시작 주소는 MSVC x64 실행 기록을 사용하고 다음 원소의 주소는 끝 네 자리 표시. 인덱스 0부터 4까지 표시.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#164b7a"/></marker></defs>
